[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-agentops"
version = "2.0.0.dev0"
description = "Manage the AI agent lifecycle on top of existing harnesses and platforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aops = "codex_agentops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_agentops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
